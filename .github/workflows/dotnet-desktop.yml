name: Build & Publish

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild HexBox.WinUI/HexBox.WinUI.csproj /t:Restore /p:Configuration=Release

      - name: Build
        run: msbuild HexBox.WinUI/HexBox.WinUI.csproj /p:Configuration=Release

      - name: Pack
        run: dotnet pack HexBox.WinUI/HexBox.WinUI.csproj -c Release --no-build

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: HexBox.WinUI/bin/Release/*.nupkg

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: windows-latest

    permissions:
      packages: write

    steps:
      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: nupkg

      - name: Push to GitHub Packages
        run: dotnet nuget push *.nupkg --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --api-key ${{ secrets.GITHUB_TOKEN }}

      - name: Push to NuGet.org
        run: dotnet nuget push *.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ secrets.NUGET_API_KEY }}
